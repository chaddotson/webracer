<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Road Racer</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: #0b1020;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #wrap {
    position: relative;
    width: min(100vw, 600px);
    height: 100dvh;
    min-height: 100svh;
    overflow: hidden;
    background: #111;
    box-shadow: 0 0 40px rgba(0,0,0,.55);
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #181818;
    touch-action: none;
  }

  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    color: #fff;
    text-shadow: 0 2px 4px #000;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
    padding:
      calc(10px + var(--safe-top))
      calc(12px + var(--safe-right))
      10px
      calc(12px + var(--safe-left));
    font-weight: 800;
    letter-spacing: .4px;
  }

  .stat {
    background: rgba(0,0,0,.42);
    border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    border-radius: 12px;
    padding: 8px 11px;
    min-width: 104px;
  }

  .small {
    font-size: 10px;
    opacity: .78;
    display: block;
    text-transform: uppercase;
  }

  .big {
    font-size: clamp(16px, 4vw, 21px);
  }

  #centerMessage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    padding:
      calc(16px + var(--safe-top))
      18px
      calc(125px + var(--safe-bottom));
    pointer-events: none;
  }

  #panel {
    background: rgba(6,10,18,.88);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 20px;
    padding: clamp(18px, 5vw, 26px);
    width: min(92%, 400px);
    box-shadow: 0 18px 60px rgba(0,0,0,.45);
  }

  #panel h1 {
    margin: 0 0 7px;
    font-size: clamp(31px, 9vw, 52px);
    letter-spacing: 2px;
  }

  #panel p {
    margin: 8px 0;
    line-height: 1.4;
    color: #dbe4ff;
    font-size: clamp(13px, 3.7vw, 16px);
  }

  #panel .accent {
    color: #ffd43b;
    font-weight: 900;
  }

  #panel button {
    pointer-events: auto;
    width: min(100%, 260px);
    min-height: 52px;
    border: 0;
    border-radius: 14px;
    padding: 14px 22px;
    margin-top: 14px;
    font: inherit;
    font-size: 16px;
    font-weight: 900;
    background: #ffd43b;
    color: #111;
    cursor: pointer;
    box-shadow: 0 7px 0 #b89500;
    touch-action: manipulation;
  }

  #panel button:active {
    transform: translateY(4px);
    box-shadow: 0 3px 0 #b89500;
  }

  #mobileControls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding:
      10px
      calc(14px + var(--safe-right))
      calc(14px + var(--safe-bottom))
      calc(14px + var(--safe-left));
    pointer-events: none;
  }

  .cluster {
    display: flex;
    gap: 10px;
  }

  .ctrl {
    pointer-events: auto;
    width: clamp(66px, 18vw, 82px);
    height: clamp(66px, 18vw, 82px);
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(3,7,16,.62);
    color: white;
    font-size: clamp(26px, 7vw, 34px);
    font-weight: 900;
    display: grid;
    place-items: center;
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    touch-action: none;
  }

  .ctrl.active,
  .ctrl:active {
    background: rgba(255,212,59,.82);
    color: #111;
    transform: scale(.96);
  }

  #rotateHint {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 20;
    place-items: center;
    background: rgba(5,9,18,.92);
    padding: 28px;
    text-align: center;
    color: white;
    pointer-events: none;
  }

  #rotateHint div {
    max-width: 320px;
    font-weight: 800;
    line-height: 1.45;
  }

  @media (orientation: landscape) and (max-height: 520px) {
    #rotateHint {
      display: grid;
    }
  }

  @media (hover:hover) and (pointer:fine) {
    #mobileControls {
      opacity: .25;
    }
  }

  @media (max-width: 380px) {
    .topbar {
      padding-left: 8px;
      padding-right: 8px;
    }

    .stat {
      min-width: 92px;
      padding: 7px 9px;
    }

    #mobileControls {
      padding-left: 8px;
      padding-right: 8px;
    }

    .cluster {
      gap: 6px;
    }
  }
</style>
</head>

<body>

<div id="wrap">

  <canvas id="game" aria-label="Road Racer game"></canvas>

  <div id="hud">

    <div class="topbar">
      <div class="stat">
        <span class="small">Score</span>
        <span class="big" id="score">000000</span>
      </div>

      <div class="stat" style="text-align:right">
        <span class="small">Speed</span>
        <span class="big">
          <span id="speed">0</span> km/h
        </span>
      </div>
    </div>

    <div id="centerMessage">
      <div id="panel">
        <h1>ROAD RACER</h1>

        <p>
          Dodge traffic and survive as the highway gets faster.
        </p>

        <p>
          <span class="accent">Mobile:</span>
          use the big buttons below.
        </p>

        <p>
          <span class="accent">Keyboard:</span>
          arrows or WASD.
        </p>

        <button id="startBtn">
          START RACE
        </button>
      </div>
    </div>

    <div id="mobileControls">

      <div class="cluster">
        <button class="ctrl" data-key="left">◀</button>
        <button class="ctrl" data-key="right">▶</button>
      </div>

      <div class="cluster">
        <button class="ctrl" data-key="brake">▼</button>
        <button class="ctrl" data-key="gas">▲</button>
      </div>

    </div>

    <div id="rotateHint">
      <div>
        For the best experience, rotate your phone back to portrait mode.
      </div>
    </div>

  </div>
</div>

<script>
(() => {

  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const wrap = document.getElementById('wrap');

  const scoreEl = document.getElementById('score');
  const speedEl = document.getElementById('speed');

  const panel = document.getElementById('panel');
  const centerMessage = document.getElementById('centerMessage');

  const startBtn = document.getElementById('startBtn');

  let W = 0;
  let H = 0;
  let dpr = 1;

  const keys = {
    left:false,
    right:false,
    gas:false,
    brake:false
  };

  const road = {
    center:280,
    width:360,
    offset:0
  };

  const player = {
    x:0,
    y:0,
    w:48,
    h:84,
    vx:0,
    color:'#ff3158'
  };

  let traffic = [];
  let particles = [];

  let running = false;
  let ending = false;

  let last = 0;
  let spawnTimer = 0;

  let speed = 0;
  let targetSpeed = 210;

  let score = 0;
  let distance = 0;

  let best =
    Number(localStorage.getItem('roadRacerBest') || 0);


  function resize() {

    const r = wrap.getBoundingClientRect();

    dpr = Math.min(
      window.devicePixelRatio || 1,
      2
    );

    W = Math.max(1, r.width);
    H = Math.max(1, r.height);

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );

    road.center = W / 2;

    road.width =
      Math.min(
        W * 0.74,
        400
      );

    player.w =
      Math.max(
        38,
        Math.min(
          58,
          road.width * 0.14
        )
      );

    player.h =
      player.w * 1.75;

    player.y =
      H -
      player.h -
      Math.max(
        118,
        H * 0.15
      );

    const minX =
      road.center -
      road.width / 2 +
      8;

    const maxX =
      road.center +
      road.width / 2 -
      player.w -
      8;

    player.x =
      Math.max(
        minX,
        Math.min(
          maxX,
          player.x ||
          W / 2 -
          player.w / 2
        )
      );

    if (!running && !ending) {
      draw();
    }
  }


  function reset() {

    traffic = [];
    particles = [];

    speed = 130;
    targetSpeed = 220;

    score = 0;
    distance = 0;

    spawnTimer = 0.35;

    ending = false;

    player.x =
      W / 2 -
      player.w / 2;

    player.vx = 0;

    scoreEl.textContent =
      '000000';

    speedEl.textContent =
      Math.round(speed);
  }


  function start() {

    reset();

    running = true;

    centerMessage.style.display =
      'none';

    last = performance.now();

    requestAnimationFrame(loop);
  }


  function endGame() {

    if (ending) return;

    ending = true;
    running = false;

    best =
      Math.max(
        best,
        Math.floor(score)
      );

    localStorage.setItem(
      'roadRacerBest',
      best
    );

    setTimeout(() => {

      panel.innerHTML = `
        <h1>CRASH!</h1>

        <p>
          Score:
          <span class="accent">
            ${Math.floor(score).toLocaleString()}
          </span>
        </p>

        <p>
          Best:
          <span class="accent">
            ${best.toLocaleString()}
          </span>
        </p>

        <p>
          Tap below or press Enter to race again.
        </p>

        <button id="restartBtn">
          RACE AGAIN
        </button>
      `;

      centerMessage.style.display =
        'grid';

      document
        .getElementById('restartBtn')
        .addEventListener(
          'click',
          start,
          { once:true }
        );

      ending = false;

    }, 260);
  }


  function roundedRect(
    x,
    y,
    w,
    h,
    r
  ) {

    r =
      Math.min(
        r,
        w / 2,
        h / 2
      );

    ctx.beginPath();

    ctx.moveTo(
      x + r,
      y
    );

    ctx.arcTo(
      x + w,
      y,
      x + w,
      y + h,
      r
    );

    ctx.arcTo(
      x + w,
      y + h,
      x,
      y + h,
      r
    );

    ctx.arcTo(
      x,
      y + h,
      x,
      y,
      r
    );

    ctx.arcTo(
      x,
      y,
      x + w,
      y,
      r
    );

    ctx.closePath();
  }


  function drawCar(
    x,
    y,
    w,
    h,
    color,
    enemy=false
  ) {

    ctx.save();

    ctx.shadowColor =
      'rgba(0,0,0,.55)';

    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 7;

    ctx.fillStyle = color;

    roundedRect(
      x,
      y,
      w,
      h,
      w * 0.22
    );

    ctx.fill();

    ctx.shadowColor =
      'transparent';

    ctx.fillStyle =
      '#151c27';

    roundedRect(
      x + w*.18,
      y + h*.17,
      w*.64,
      h*.27,
      w*.08
    );

    ctx.fill();

    ctx.fillStyle =
      '#85d9ff';

    roundedRect(
      x + w*.22,
      y + h*.19,
      w*.56,
      h*.18,
      w*.06
    );

    ctx.fill();

    ctx.fillStyle = '#111';

    ctx.fillRect(
      x-3,
      y+h*.20,
      5,
      h*.20
    );

    ctx.fillRect(
      x+w-2,
      y+h*.20,
      5,
      h*.20
    );

    ctx.fillRect(
      x-3,
      y+h*.64,
      5,
      h*.20
    );

    ctx.fillRect(
      x+w-2,
      y+h*.64,
      5,
      h*.20
    );

    ctx.fillStyle =
      enemy
      ? '#ffef9a'
      : '#fff6cc';

    ctx.fillRect(
      x+w*.12,
      y+5,
      w*.2,
      5
    );

    ctx.fillRect(
      x+w*.68,
      y+5,
      w*.2,
      5
    );

    ctx.fillStyle =
      '#ff4238';

    ctx.fillRect(
      x+w*.12,
      y+h-9,
      w*.2,
      5
    );

    ctx.fillRect(
      x+w*.68,
      y+h-9,
      w*.2,
      5
    );

    ctx.restore();
  }


  function drawRoad() {

    ctx.fillStyle =
      '#173b22';

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    const left =
      road.center -
      road.width / 2;

    const right =
      road.center +
      road.width / 2;

    const band =
      Math.max(
        14,
        road.width * 0.045
      );

    ctx.fillStyle =
      '#d2d2d2';

    ctx.fillRect(
      left-band,
      0,
      band,
      H
    );

    ctx.fillRect(
      right,
      0,
      band,
      H
    );

    const stripeH = 45;
    const gap = 45;

    const scroll =
      (road.offset * 1.25) %
      (stripeH + gap);

    for (
      let y =
        -stripeH -
        gap +
        scroll;

      y <
        H +
        stripeH;

      y +=
        stripeH +
        gap
    ) {

      ctx.fillStyle =
        '#e84e43';

      ctx.fillRect(
        left-band,
        y,
        band,
        stripeH
      );

      ctx.fillRect(
        right,
        y,
        band,
        stripeH
      );
    }

    const grad =
      ctx.createLinearGradient(
        left,
        0,
        right,
        0
      );

    grad.addColorStop(
      0,
      '#292929'
    );

    grad.addColorStop(
      .5,
      '#333'
    );

    grad.addColorStop(
      1,
      '#292929'
    );

    ctx.fillStyle = grad;

    ctx.fillRect(
      left,
      0,
      road.width,
      H
    );

    ctx.fillStyle =
      'rgba(255,255,255,.88)';

    const lanes = 3;
    const dash = 46;
    const space = 40;

    const s =
      road.offset %
      (dash + space);

    for (
      let lane = 1;
      lane < lanes;
      lane++
    ) {

      const x =
        left +
        road.width *
        lane /
        lanes -
        2;

      for (
        let y =
          -dash -
          space +
          s;

        y <
          H +
          dash;

        y +=
          dash +
          space
      ) {

        ctx.fillRect(
          x,
          y,
          4,
          dash
        );
      }
    }

    const glow =
      ctx.createLinearGradient(
        0,
        0,
        0,
        H*.35
      );

    glow.addColorStop(
      0,
      'rgba(255,255,255,.11)'
    );

    glow.addColorStop(
      1,
      'rgba(255,255,255,0)'
    );

    ctx.fillStyle = glow;

    ctx.fillRect(
      left,
      0,
      road.width,
      H*.35
    );
  }


  function spawnTraffic() {

    const lanes = 3;

    const laneW =
      road.width /
      lanes;

    const occupied =
      new Set(
        traffic
          .filter(
            t =>
              t.y < 180
          )
          .map(
            t =>
              t.lane
          )
      );

    let candidates =
      [0,1,2]
        .filter(
          l =>
            !occupied.has(l)
        );

    if (!candidates.length) {
      candidates =
        [0,1,2];
    }

    const lane =
      candidates[
        Math.floor(
          Math.random() *
          candidates.length
        )
      ];

    const w =
      player.w *
      (
        .9 +
        Math.random() *
        .18
      );

    const h =
      w *
      1.75;

    const colors = [
      '#3aa7ff',
      '#ffc43b',
      '#9c69ff',
      '#22c77a',
      '#ff6b35',
      '#e9e9e9'
    ];

    const x =
      road.center -
      road.width/2 +
      laneW*lane +
      laneW/2 -
      w/2;

    traffic.push({
      lane,
      x,
      y:-h-20,
      w,
      h,

      color:
        colors[
          Math.floor(
            Math.random() *
            colors.length
          )
        ],

      rel:
        Math.random()*55 +
        55
    });
  }


  function collide(
    a,
    b
  ) {

    const m = 6;

    return (
      a.x+m <
        b.x+b.w-m &&

      a.x+a.w-m >
        b.x+m &&

      a.y+m <
        b.y+b.h-m &&

      a.y+a.h-m >
        b.y+m
    );
  }


  function crashFX() {

    for (
      let i=0;
      i<40;
      i++
    ) {

      particles.push({

        x:
          player.x +
          player.w/2,

        y:
          player.y +
          player.h/2,

        vx:
          (Math.random()-.5) *
          320,

        vy:
          (Math.random()-.7) *
          320,

        life:
          .55 +
          Math.random()*.6,

        size:
          2 +
          Math.random()*7
      });
    }
  }


  function update(dt) {

    if (keys.gas) {

      targetSpeed =
        Math.min(
          335,
          targetSpeed +
          95*dt
        );

    } else {

      targetSpeed =
        Math.max(
          205,
          targetSpeed -
          22*dt
        );
    }

    if (keys.brake) {

      targetSpeed =
        Math.max(
          95,
          targetSpeed -
          170*dt
        );
    }

    speed +=
      (targetSpeed-speed) *
      Math.min(
        1,
        dt*2.5
      );

    distance +=
      speed *
      dt;

    score +=
      speed *
      dt *
      .18;

    road.offset +=
      speed *
      dt *
      .65;

    const accel = 900;
    const drag = .83;

    if (keys.left) {
      player.vx -=
        accel * dt;
    }

    if (keys.right) {
      player.vx +=
        accel * dt;
    }

    player.vx *=
      Math.pow(
        drag,
        dt*60
      );

    player.x +=
      player.vx *
      dt;

    const edgeL =
      road.center -
      road.width/2 +
      8;

    const edgeR =
      road.center +
      road.width/2 -
      player.w -
      8;

    if (
      player.x <
      edgeL
    ) {

      player.x =
        edgeL;

      player.vx =
        Math.max(
          0,
          player.vx*.25
        );

      targetSpeed =
        Math.max(
          120,
          targetSpeed -
          40*dt
        );
    }

    if (
      player.x >
      edgeR
    ) {

      player.x =
        edgeR;

      player.vx =
        Math.min(
          0,
          player.vx*.25
        );

      targetSpeed =
        Math.max(
          120,
          targetSpeed -
          40*dt
        );
    }

    spawnTimer -= dt;

    if (
      spawnTimer <=
      0
    ) {

      spawnTraffic();

      const difficulty =
        Math.min(
          .72,
          score /
          11000
        );

      spawnTimer =
        Math.max(
          .34,
          .92 -
          difficulty
        ) +
        Math.random() *
        .34;
    }

    for (
      const t
      of traffic
    ) {

      t.y +=
        (
          speed*.85 +
          t.rel
        ) *
        dt *
        .82;

      if (
        collide(
          player,
          t
        )
      ) {

        crashFX();
        endGame();

        break;
      }
    }

    traffic =
      traffic.filter(
        t =>
          t.y <
          H +
          t.h +
          30
      );

    scoreEl.textContent =
      String(
        Math.floor(score)
      ).padStart(
        6,
        '0'
      );

    speedEl.textContent =
      Math.round(speed);
  }


  function drawParticles(dt) {

    for (
      const p
      of particles
    ) {

      p.x +=
        p.vx *
        dt;

      p.y +=
        p.vy *
        dt;

      p.vy +=
        440 *
        dt;

      p.life -=
        dt;

      ctx.globalAlpha =
        Math.max(
          0,
          p.life
        );

      ctx.fillStyle =
        Math.random() > .35
        ? '#ff9f1c'
        : '#fff1a8';

      ctx.fillRect(
        p.x,
        p.y,
        p.size,
        p.size
      );
    }

    ctx.globalAlpha =
      1;

    particles =
      particles.filter(
        p =>
          p.life >
          0
      );
  }


  function draw() {

    ctx.clearRect(
      0,
      0,
      W,
      H
    );

    drawRoad();

    for (
      const t
      of traffic
    ) {

      drawCar(
        t.x,
        t.y,
        t.w,
        t.h,
        t.color,
        true
      );
    }

    drawCar(
      player.x,
      player.y,
      player.w,
      player.h,
      player.color,
      false
    );

    if (
      speed >
      270
    ) {

      ctx.strokeStyle =
        'rgba(255,255,255,.16)';

      ctx.lineWidth =
        2;

      for (
        let i=0;
        i<10;
        i++
      ) {

        const x =
          Math.random() *
          W;

        const y =
          Math.random() *
          H *
          .8;

        ctx.beginPath();

        ctx.moveTo(
          x,
          y
        );

        ctx.lineTo(
          x,
          y +
          20 +
          Math.random() *
          55
        );

        ctx.stroke();
      }
    }
  }


  function loop(now) {

    const dt =
      Math.min(
        .033,
        (now-last) /
        1000 ||
        0
      );

    last = now;

    if (running) {

      update(dt);
      draw();

      requestAnimationFrame(loop);

    } else if (
      particles.length
    ) {

      draw();
      drawParticles(dt);

      requestAnimationFrame(loop);
    }
  }


  function setKey(
    k,
    value
  ) {

    if (
      k in keys
    ) {
      keys[k] =
        value;
    }
  }


  const keyMap = {

    ArrowLeft:'left',
    a:'left',
    A:'left',

    ArrowRight:'right',
    d:'right',
    D:'right',

    ArrowUp:'gas',
    w:'gas',
    W:'gas',

    ArrowDown:'brake',
    s:'brake',
    S:'brake'

  };


  addEventListener(
    'keydown',
    e => {

      if (
        keyMap[e.key]
      ) {

        e.preventDefault();

        setKey(
          keyMap[e.key],
          true
        );
      }

      if (
        (
          e.key ===
          'Enter' ||

          e.key ===
          ' '
        ) &&

        !running &&
        !ending
      ) {

        e.preventDefault();
        start();
      }
    }
  );


  addEventListener(
    'keyup',
    e => {

      if (
        keyMap[e.key]
      ) {

        e.preventDefault();

        setKey(
          keyMap[e.key],
          false
        );
      }
    }
  );


  function releaseAllControls() {

    Object.keys(keys)
      .forEach(
        k =>
          keys[k] =
          false
      );

    document
      .querySelectorAll('.ctrl')
      .forEach(
        b =>
          b.classList.remove(
            'active'
          )
      );
  }


  document
    .querySelectorAll('.ctrl')
    .forEach(
      btn => {

        const k =
          btn.dataset.key;

        const down =
          e => {

            e.preventDefault();

            btn.setPointerCapture?.(
              e.pointerId
            );

            btn.classList.add(
              'active'
            );

            setKey(
              k,
              true
            );
          };

        const up =
          e => {

            e.preventDefault();

            btn.classList.remove(
              'active'
            );

            setKey(
              k,
              false
            );
          };

        btn.addEventListener(
          'pointerdown',
          down
        );

        btn.addEventListener(
          'pointerup',
          up
        );

        btn.addEventListener(
          'pointercancel',
          up
        );

        btn.addEventListener(
          'lostpointercapture',
          up
        );

        btn.addEventListener(
          'contextmenu',
          e =>
            e.preventDefault()
        );
      }
    );


  document.addEventListener(
    'visibilitychange',
    () => {

      if (
        document.hidden
      ) {
        releaseAllControls();
      }
    }
  );


  window.addEventListener(
    'blur',
    releaseAllControls
  );

  window.addEventListener(
    'resize',
    resize
  );

  window.visualViewport
    ?.addEventListener(
      'resize',
      resize
    );

  startBtn.addEventListener(
    'click',
    start
  );

  resize();
  draw();

})();
</script>

</body>
</html>
